name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      - name: Verify AI service before publication
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('site.config.json', 'utf8'));
          const apiBase = (process.env.PUBLIC_API_BASE || config.apiBase || '').replace(/\/$/, '');
          if (!apiBase) process.exit(0);
          const origin = 'https://masterlkk.github.io';
          const status = await fetch(apiBase + '/api/status', {
            headers: { Origin: origin }, signal: AbortSignal.timeout(20000),
          });
          assert.equal(status.status, 200, 'AI backend must be reachable before publishing');
          assert.equal(status.headers.get('Access-Control-Allow-Origin'), origin);
          const details = await status.json();
          assert.equal(details.aiConfigured, true);
          assert.equal(details.reviewsAvailable, true);
          const preflight = await fetch(apiBase + '/api/analyze', {
            method: 'OPTIONS', signal: AbortSignal.timeout(20000),
            headers: { Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'Content-Type' },
          });
          assert.equal(preflight.status, 204);
          assert.equal(preflight.headers.get('Access-Control-Allow-Origin'), origin);
          console.log('AI backend is available and permits requests from GitHub Pages.');
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify published website
        run: node scripts/verify-deployment.mjs
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
