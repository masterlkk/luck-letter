name: Deploy AI backend to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - name: Create deployment configuration
        run: node scripts/worker-config.mjs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ALLOWED_ORIGINS: https://masterlkk.github.io
      - name: Apply database migrations
        run: npx --yes wrangler@4 d1 migrations apply luck-letter --remote --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy backend and assets
        run: npx --yes wrangler@4 deploy --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
